name: Core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python -m pytest -q
      - name: Generate standalone offline demo
        run: python scripts/make_standalone_demo.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: yorevia-offline-visual-demo
          path: Yorevia-visual-demo.html

name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Apple-Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            extension: ''
          - name: macOS-Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            extension: ''
          - name: Windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            extension: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Fetch and verify official local face models
        run: python scripts/fetch_models.py
      - name: Test core and real model inference
        run: python -m pytest -q
        env:
          YOREVIA_REQUIRE_MODELS: '1'
      - run: python scripts/make_icons.py
      - name: Build native Python engine
        run: python scripts/build_sidecar.py --target ${{ matrix.target }}
      - name: Smoke-test bundled engine
        run: python scripts/smoke_sidecar.py src-tauri/binaries/yorevia-engine-${{ matrix.target }}${{ matrix.extension }}
      - name: Test native command boundary
        working-directory: src-tauri
        run: cargo test
      - name: Build unsigned alpha installers
        run: npx tauri build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Preserve resolved dependency state
        shell: bash
        run: |
          python -m pip freeze > build/python-resolved.txt
          cp package-lock.json build/npm-resolved-lock.json
          cp src-tauri/Cargo.lock build/Cargo-resolved.lock
      - uses: actions/upload-artifact@v4
        with:
          name: Yorevia-${{ matrix.name }}-unsigned-alpha
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            build/*resolved*
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Yorevia-*
          path: artifacts
      - name: Create a draft prerelease only after every target succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Yorevia $GITHUB_REF_NAME · Alpha" --notes "Unsigned alpha packages. Not notarized; no Windows signing certificate. Native functionality and recognition accuracy still require manual acceptance before public release."
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME"
